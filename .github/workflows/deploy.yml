name: deploy
on:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo deploy dev from ${{ github.sha }}
  staging:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo deploy staging from ${{ github.ref_name }}
  production:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo deploy production from ${{ github.ref_name }}
